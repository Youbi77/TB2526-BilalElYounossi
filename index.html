<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title> ITB LEAKS - Calculadora Energètica</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="cyber-nav">
        <div class="logo" id="main-logo">ITB <span class="neon-text">LEAKS</span></div>
    </nav>
    <canvas id="canvas-fx"></canvas>
    <main class="dashboard-grid">
        <aside class="control-panel glass">
            <h2 class="section-title">CONFIGURACIÓ</h2>
            <div class="input-group">
                <label>ALUMNAT TOTAL</label>
                <input type="number" id="alumnes" value="950">
            </div>
            <div class="input-group">
                <label>SUPERFÍCIE (m²)</label>
                <input type="number" id="m2" value="12000">
            </div>
        </aside>
        <section class="results-area">
            <div class="kpi-grid" id="display"></div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
